flutter_native_splash:
  # ========= Android11及以下、iOS：全屏方案 =========
  background_image: assets/splash_full.png  # 你现在这张完整原图（带文字）
  background_image_dark: assets/splash.png
  color: "#ffffff"
  color_dark: "#121212"
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  fullscreen: true

  # ========= Android12+ 适配图（正方形罗盘，无底部文字） =========
  android_12:
    image: assets/splash.png
    image_dark: assets/splash.png
    icon_background_color: "#121212"
